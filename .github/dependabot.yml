version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Lab shares its sources with thedatadriver.app: major upgrades of the
      # toolchain and libraries land on the site first, then are mirrored here.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned through "overrides" in package.json: newer rules flag shared code.
      - dependency-name: eslint-plugin-react-hooks
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
